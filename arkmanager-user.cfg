# --- USER CONFIG --- #
# ARK server options - use ark_<optionname>=<value>
# comment out these values if you want to define them
# inside your GameUserSettings.ini file
# Port config 
ark_Port=${STEAMPORT}                                           # ARK server port (default 7778)
ark_QueryPort=${SERVERPORT}                                     # ARK query port (default 27016)
ark_RCONEnabled=${ENABLERCON}                                      # Enable RCON Protocol (true or false)
ark_RCONPort=${RCONPORT}                                        # RCON Port
#serverMapModId="469987622"                                     # Uncomment this to specify the Map Mod Id (<fileid> in http://steamcommunity.com/sharedfiles/filedetails/?id=<fileid>)
serverMap=${SERVERMAP}                                          # server map (default TheIsland)
#ark_TotalConversionMod="496735411"                             # Uncomment this to specify a total-conversion mod
ark_SessionName=${SESSIONNAME}                                  # if your session name needs special characters please use the .ini instead
ark_ServerPassword=${SERVERPASSWORD}                            # ARK server password, empty: no password required to login
ark_ServerAdminPassword=${ADMINPASSWORD}                        # ARK server admin password, KEEP IT SAFE!
ark_MaxPlayers=${MAX_PLAYERS}                                   # Number MAX of player

# Rates / Multipliers (GAMERULE_* ENVs) - all GameUserSettings.ini [ServerSettings]
# keys, settable via command-line launch params. Defaults = vanilla, no change
# unless overridden.
#
# Breeding/Game.ini-only settings (GAMEINI_* ENVs: EggHatchSpeedMultiplier,
# BabyMatureSpeedMultiplier, MatingIntervalMultiplier, OverrideOfficialDifficulty,
# PoopIntervalMultiplier, AllowAnyoneBabyImprintCuddle, ForceAllStructureLocking,
# FastDecayUnsnappedCoreStructures, DestroyUnconnectedWaterPipes, FastDecayInterval,
# ResourceNoReplenishRadiusStructures) go through a real Game.ini instead, since
# this ark_<Name> launch-param mechanism can't set them - see run.sh, which
# regenerates /ark/Game.ini.generated from those envs on every start, and
# arkGameIniFile below, which tells arkmanager to copy it into place on start
# (same "cp on every doStart()" mechanism as arkGameUserSettingsIniFile).
arkGameIniFile="/ark/Game.ini.generated"
ark_XPMultiplier=${GAMERULE_XP_MULTIPLIER}                                     # Experience gain multiplier
ark_TamingSpeedMultiplier=${GAMERULE_TAMING_MULTIPLIER}                        # Taming speed multiplier
ark_HarvestAmountMultiplier=${GAMERULE_HARVEST_MULTIPLIER}                     # Harvest amount multiplier
ark_DayTimeSpeedScale=${GAMERULE_DAY_TIME_SPEED_SCALE}                         # Day cycle speed
ark_NightTimeSpeedScale=${GAMERULE_NIGHT_TIME_SPEED_SCALE}                     # Night cycle speed
ark_PvEDinoDecayPeriodMultiplier=${GAMERULE_DINO_DECAY_MULTIPLIER}             # Wild/tamed dino decay speed (PvE)
ark_PvEStructureDecayPeriodMultiplier=${GAMERULE_STRUCTURE_DECAY_MULTIPLIER}   # Structure decay speed (PvE)
ark_PvPStructureDecay=${GAMERULE_PVP_STRUCTURE_DECAY}                         # Enable structure decay on PvP servers
ark_PvPDinoDecay=${GAMERULE_PVP_DINO_DECAY}                                   # Enable dino decay on PvP servers
ark_PreventOfflinePvP=${GAMERULE_PREVENT_OFFLINE_PVP}                         # Offline-raid protection
ark_PreventOfflinePvPInterval=${GAMERULE_PREVENT_OFFLINE_PVP_INTERVAL}        # Seconds offline before protection kicks in
ark_MaxPlatformSaddleStructureLimit=${GAMERULE_MAX_PLATFORM_SADDLE_STRUCTURE_LIMIT}     # Max structures per platform saddle
ark_PerPlatformMaxStructuresMultiplier=${GAMERULE_PER_PLATFORM_MAX_STRUCTURES_MULTIPLIER} # Platform structure limit multiplier
ark_AutoDestroyDecayedDinos=${GAMERULE_AUTO_DESTROY_DECAYED_DINOS}            # Auto-remove fully decayed dinos
ark_ShowFloatingDamageText=${GAMERULE_SHOW_FLOATING_DAMAGE_TEXT}              # Show floating damage numbers

# ark_bRawSockets=""                                            # Uncomment if you want to use ark raw socket (instead of steam p2p) [Not recommended]
arkflag_log=""
ark_BanListURL="http://playark.com/banlist.txt"                 # Use Banlist from playark
arkflag_USEALLAVAILABLECORES=true                               # Use all available corse
ark_AltSaveDirectoryName="Saved-"${SERVERMAP}                   # Set alternative backup directory
arkopt_clusterid=${ARKCLUSTERID}                                # Clusterid if there are multiple servers

# ----- Mods ----- #
#ark_GameModIds="2885772943,731604991,719928795"                    # Commented Example on how to use Mods
ark_GameModIds="2885772943,731604991,719928795,630601751"                     # No mods preconfigured - justz enter the numbers seperated by comma
# Mod OS Selection
mod_branch=Windows
# Add mod-specific OS selection below:
#mod_branch_496735411=Windows
# ----------------#

# ARK server flags - use arkflag_<optionname>=true
#arkflag_OnlyAdminRejoinAsSpectator=true                            # Uncomment to only allow admins to rejoin as spectator
#arkflag_DisableDeathSpectator=true                                 # Uncomment to disable players from becoming spectators when they die

# ARK server options - i.e. for -optname=val, use arkopt_optname=val
#arkopt_StructureDestructionTag=DestroySwampSnowStructures

#ark_AltSaveDirectoryName="SotF"                                    # Uncomment to specify a different save directory name

# Update warning messages
# Modify as desired, putting the %d replacement operator where the number belongs
msgWarnUpdateMinutes="This ARK server will shutdown for an update in %d minutes"
msgWarnUpdateSeconds="This ARK server will shutdown for an update in %d seconds"
msgWarnRestartMinutes="This ARK server will shutdown for a restart in %d minutes"
msgWarnRestartSeconds="This ARK server will shutdown for a restart in %d seconds"
msgWarnShutdownMinutes="This ARK server will shutdown in %d minutes"
msgWarnShutdownSeconds="This ARK server will shutdown in %d seconds"

# config environment
arkwarnminutes="15"                                                # number of minutes to warn players when using update --warn
arkBackupPreUpdate="true"                                          # set this to true if you want to perform a backup before updating

# Options to automatically remove old backups to keep backup size in check
# Each compressed backup is generally about 1-2MB in size.
#arkMaxBackupSizeMB="500"                                          # Set to automatically remove old backups when size exceeds this limit
arkMaxBackupSizeGB="3"                                             # Uncomment this and comment the above to specify the limit in whole GB
